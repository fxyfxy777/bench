global:
  port: 2788
  CUDA_VISIBLE_DEVICES: 0,1,2,3
  extra_ports_offsets: [100, 200, 300]
  health_url: "http://127.0.0.1:2788/health"
  server_ready_timeout: 1000
  shutdown_wait: 20
  results_dir: "./results"

# ══════════════════════════════════════════════════════════════════════════════
# Prefill Batching 参数扫描
#
# 数据集：多轮  输入~8k 输出~200  并发64
#
# 实验设计思路：
#   1) baseline: 无攒批 (FD_MIN_PREFILL_BATCH=1)
#   2) MIN=2, WAIT=100ms: 上次跑出来的最优（已确认 tps 提升）
#   3) MIN=5, WAIT=200ms:  缩短超时，减少 TTFT 增量，看 tps 是否还能保住
#   4) MIN=2, WAIT=200ms: 放长超时，看能否进一步减少 #new-seq=1 的超时调度
#   5) MIN=3, WAIT=100ms: 攒更多条，更激进地减少混合 step 数
#   6) MIN=2, WAIT=0 (无超时): 极端测试：强制必须 2 条才调度，摸上限
# ══════════════════════════════════════════════════════════════════════════════

experiments:
  # ── 0. Baseline：无攒批 ──────────────────────────────────────────────────
  - name: baseline_no_batch
    server: |
      export CUDA_VISIBLE_DEVICES=0,1,2,3
      # export FD_ENABLE_STEP_TIMING=1
      export DG_CACHE_DIR=/root/paddlejob/share-storage/gpfs/system-public/fanxiangyu/.deep_gemm_cache
      export PYTHONPATH="../FastDeploy:$PYTHONPATH"
      export FD_SAMPLING_CLASS=rejection
      export FD_ENGINE_TASK_QUEUE_WITH_SHM=1
      export FD_CUSTOM_AR_MAX_SIZE_MB=8
      export MAX_PREFILL_NUM=128
      model_path=..//models/GLM-4.5-Air
      ../fxy_py12_fa4/bin/python -m fastdeploy.entrypoints.openai.api_server \
          --model $model_path \
          --port 2788 \
          --max-model-len 131072 \
          --enable-overlap-schedule \
          --tensor-parallel-size 4 \
          --max-num-seqs 512 \
          --max-long-partial-prefills 128 \
          --max-num-partial-prefills 128 \
          --max-num-batched-tokens 32768 \
          --speculative-config '{"method": "mtp", "num_speculative_tokens": 1, "num_model_steps": 1, "model": "'$model_path'"}' \
          --graph-optimization-config '{"use_cudagraph": true, "draft_model_use_cudagraph": true}' \
          --enable-flashinfer-allreduce-fusion \
          --workers 1 \
          --enable-logprob
    infer: |
      ../fxy_sglang/bin/python ../FastDeploy/benchmarks/benchmark_serving.py \
          --backend openai-chat \
          --model GLM-4.5-Air \
          --endpoint /v1/chat/completions \
          --host 127.0.0.1 --port 2788 \
          --dataset-name EBChat \
          --dataset-path ../sglang/debug/20260302_browsecomp_plus_processed_num_830_fd.jsonl \
          --hyperparameter-path ../sglang/debug/request_duolun.yaml \
          --percentile-metrics ttft,tpot,itl,e2el,s_ttft,s_itl,s_e2el,s_decode,input_len,s_input_len,output_len \
          --metric-percentiles 80,95,99,99.9,99.95,99.99 \
          --num-prompts 830 \
          --multi-turn \
          --max-concurrency 64
  - name: baseline_no_batch_swe
    server: |
      export CUDA_VISIBLE_DEVICES=0,1,2,3
      # export FD_ENABLE_STEP_TIMING=1
      export DG_CACHE_DIR=/root/paddlejob/share-storage/gpfs/system-public/fanxiangyu/.deep_gemm_cache
      export PYTHONPATH="../FastDeploy:$PYTHONPATH"
      export FD_SAMPLING_CLASS=rejection
      export FD_ENGINE_TASK_QUEUE_WITH_SHM=1
      export FD_CUSTOM_AR_MAX_SIZE_MB=8
      export MAX_PREFILL_NUM=128
      model_path=..//models/GLM-4.5-Air
      ../fxy_py12_fa4/bin/python -m fastdeploy.entrypoints.openai.api_server \
          --model $model_path \
          --port 2788 \
          --max-model-len 131072 \
          --tensor-parallel-size 4 \
          --max-num-seqs 512 \
          --speculative-config '{"method": "mtp", "num_speculative_tokens": 1, "num_model_steps": 1, "model": "'$model_path'"}' \
          --graph-optimization-config '{"use_cudagraph": true, "draft_model_use_cudagraph": true}' \
          --enable-flashinfer-allreduce-fusion
    infer: |
      ../fxy_sglang/bin/python ../FastDeploy_RL/benchmarks/benchmark_serving.py \
          --backend openai-chat \
          --model EB45T \
          --endpoint /v1/chat/completions \
          --ip-list 127.0.0.1:2788 \
          --dataset-name EBChat \
          --dataset-path ../sglang/debug/swe_data_500_fd.json \
          --percentile-metrics ttft,tpot,itl,e2el,s_ttft,res_ttft,s_itl,s_e2el,s_decode,input_len,s_input_len,reasoning_len,output_len \
