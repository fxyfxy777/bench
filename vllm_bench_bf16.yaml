global:
  port: 5355
  CUDA_VISIBLE_DEVICES: 4,5,6,7
  health_url: "http://127.0.0.1:5355/health"
  server_ready_timeout: 600   # 等待服务启动最长秒数（长输入模型加载慢，设长一点）
  shutdown_wait: 20           # kill server 后等待 GPU 显存释放的秒数
  results_dir: "./results"    # 结果目录（相对于本文件所在目录）

experiments:

  # ════════════════════════════════════════════════════════════════════════════
  # 一、中短数据集  输入:2k  输出:1k
  # ════════════════════════════════════════════════════════════════════════════

  - name: vllm_中短_MTP_c512
    server: |
      export CUDA_VISIBLE_DEVICES=4,5,6,7
      MODEL_PATH=/root/paddlejob/share-storage/gpfs/system-public/wangyanpeng04/models/GLM-4.5-Air-Multi-MTP
      ../bzz2_fxy_vllm/bin/python -m vllm.entrypoints.openai.api_server \
          --model ${MODEL_PATH} \
          --served-model-name GLM-4.5-Air \
          --port 5355 \
          --max-model-len 65536 \
          --max-num-seqs 512 \
          --tensor-parallel-size 4 \
          --speculative_config '{"method":"mtp","num_speculative_tokens":1}'
    infer: |
      ../fxy_py12_fa4/bin/python \
          ../FastDeploy/benchmarks/benchmark_serving.py \
          --backend openai-chat \
          --model GLM-4.5-Air \
          --endpoint /v1/chat/completions \
          --host 127.0.0.1 --port 5355 \
          --dataset-name EBChat \
          --dataset-path ../sglang/debug/0724_ShareGPT_range_1800_3000_num_5000_FD.jsonl \
          --hyperparameter-path ../sglang/debug/request.yaml \
          --percentile-metrics ttft,tpot,itl,e2el,s_ttft,s_itl,s_e2el,s_decode,input_len,s_input_len,output_len \
          --metric-percentiles 80,95,99,99.9,99.95,99.99 \
          --num-prompts 5000 \
          --max-concurrency 512

  - name: vllm_中短_MTP_c64
    server: |
      export CUDA_VISIBLE_DEVICES=4,5,6,7
      MODEL_PATH=/root/paddlejob/share-storage/gpfs/system-public/wangyanpeng04/models/GLM-4.5-Air-Multi-MTP
      ../bzz2_fxy_vllm/bin/python -m vllm.entrypoints.openai.api_server \
          --model ${MODEL_PATH} \
          --served-model-name GLM-4.5-Air \
          --port 5355 \
          --max-model-len 65536 \
          --max-num-seqs 512 \
          --tensor-parallel-size 4 \
          --speculative_config '{"method":"mtp","num_speculative_tokens":1}'
    infer: |
      ../fxy_py12_fa4/bin/python \
          ../FastDeploy/benchmarks/benchmark_serving.py \
          --backend openai-chat \
          --model GLM-4.5-Air \
          --endpoint /v1/chat/completions \
          --host 127.0.0.1 --port 5355 \
          --dataset-name EBChat \
          --dataset-path ../sglang/debug/0724_ShareGPT_range_1800_3000_num_5000_FD.jsonl \
          --hyperparameter-path ../sglang/debug/request.yaml \
          --percentile-metrics ttft,tpot,itl,e2el,s_ttft,s_itl,s_e2el,s_decode,input_len,s_input_len,output_len \
          --metric-percentiles 80,95,99,99.9,99.95,99.99 \
          --num-prompts 5000 \
          --max-concurrency 64

  

