global:
  port: 4221
  health_url: "http://127.0.0.1:4221/health"
  server_ready_timeout: 1000
  shutdown_wait: 20
  results_dir: "./results"
  # kill 时额外清理的端口（覆盖所有三个实验用到的 auxiliary 端口）
  kill_ports: [4222,4223,4224,4225,5521,5522,5523,5524,7591,7592,7593,7594,8651,8652,8653,8654]
  CUDA_VISIBLE_DEVICES: "4,5,6,7"

experiments:

  - name: fd_blackwell_DP4_MTP
    server: |
      export FD_SAMPLING_CLASS=triton

      # === env.common ===
      export USE_FAST_TOKENIZER='1'
      export NVSHMEM_DISABLE_NCCL='1'
      export NVSHMEM_BOOTSTRAP='UID'
      export NVSHMEM_BOOTSTRAP_UID_SOCK_FAMILY='AF_INET'
      unset NVSHMEM_HCA_LIST
      unset FD_PLUGINS
      export FD_USE_DEEP_GEMM='1'
      export RL_EB5_NEED_SKIP_QUANT='0'
      export SPECULATE_VERIFY_USE_TARGET_SAMPLING='0'
      export HYDRA_FULL_ERROR='1'
      export FD_USE_PHI_FP8_QUANT='0'
      export FLAGS_use_legacy_linear='0'

      # === env.inference_backend ===
      export PYTHONPATH="../FastDeploy:$PYTHONPATH"
      
      export FD_USE_GET_SAVE_OUTPUT_V1='0'
      export FD_USE_PFCC_DEEP_EP='1'
      export FD_ENABLE_MULTI_API_SERVER='1'
      export FD_ENGINE_TASK_QUEUE_WITH_SHM='1'
      export FD_ZMQ_SNDHWM='0'
      export FD_SERVICE_NAME='FastDeploy'
      export ENABLE_V1_KVCACHE_SCHEDULER='1'
      export TRACES_ENABLE='True'
      export TRACES_EXPORTER='otlp'
      export EXPORTER_OTLP_ENDPOINT='http://apm-collector.bj.baidubce.com/v1/traces'
      export EXPORTER_OTLP_HEADERS='Authentication=T58djjKywSYZtIEB6RHP1yig'
      export FD_DEBUG='0'
      export FD_USE_PHI_MOE_PERMUTE='0'
      export QKRMSNORM_USE_PHI_RMSNORM='0'
      export FD_USE_PHI_MOE_TOPK='0'
      export FD_MOE_PROB_IN_ADVANCE='0'
      export FD_SiluAndMul_USE_PHI_SWIGLU='0'
      export FD_ENABLE_RL='0'
      export FD_FP8_QUANT_WITH_POW2SCALE='0'

      unset PADDLE_TRAINERS_NUM
      unset PADDLE_ELASTIC_JOB_ID
      unset PADDLE_TRAINER_ENDPOINTS
      unset DISTRIBUTED_TRAINER_ENDPOINTS
      unset FLAGS_START_PORT
      unset PADDLE_ELASTIC_TIMEOUT

      export CUDA_VISIBLE_DEVICES=4,5,6,7

      # ckl EP 环境变量
      export FD_USE_PFCC_DEEP_EP=1
      export FD_USE_PHI_MOE_TOPK=1
      export FD_USE_PHI_MOE_PERMUTE=1
      export FD_SiluAndMul_USE_PHI_SWIGLU=1
      export FD_MOE_PROB_IN_ADVANCE=1
      export FD_USE_PHI_RMSNORM=1
      export FD_ENABLE_RL=1
      export FD_USE_DEEP_GEMM=1

      export FD_ENC_DEC_BLOCK_NUM=3

      model_path=/root/paddlejob/share-storage/gpfs/system-public/wangyanpeng04/models/GLM-4.5-Air-Multi-MTP
      /bin/python_fxy -m fastdeploy.entrypoints.openai.multi_api_server \
          --ports 4221,4222,4223,4224 \
          --num-servers 4 \
          --metrics-ports 5521,5522,5523,5524 \
          --args --model ${model_path} \
          --engine-worker-queue-port 7591,7592,7593,7594 \
          --cache-queue-port 8651,8652,8653,8654 \
          --load-choices default_v1 \
          --max-num-seqs 24 \
          --max-model-len 131072 \
          --enable-prefix-caching \
          --max-num-batched-tokens 8192 \
          --disable-custom-all-reduce \
          --speculative-config '{"method": "mtp", "num_speculative_tokens": 3, "num_model_steps": 3,"model": "'${model_path}'", "verify_strategy": "target_match"}' \
          --graph-optimization-config '{"use_cudagraph":true,"use_unique_memory_pool":true,"draft_model_use_cudagraph": true}' \
          --enable-logprob \
          --tensor-parallel-size 1 \
          --data-parallel-size 4 \
          --enable-expert-parallel \
          --enable-moe-scores-elementwise-fuse \
          --enable-flashinfer-allreduce-fusion \
          --prealloc-dec-block-slot-num-threshold 36
    infer: |
      ../fxy_sglang/bin/python ../FastDeploy_RL/benchmarks/benchmark_serving.py \
          --backend openai-chat \
          --model EB45T \
          --endpoint /v1/chat/completions \
          --ip-list 127.0.0.1:4221,127.0.0.1:4222,127.0.0.1:4223,127.0.0.1:4224 \
          --dataset-name EBChat \
          --dataset-path ../sglang/debug/swe_data_500_fd.json \
          --percentile-metrics ttft,tpot,itl,e2el,s_ttft,res_ttft,s_itl,s_e2el,s_decode,input_len,s_input_len,reasoning_len,output_len \
          --metric-percentiles 80,95,99,99.9,99.95,99.99 \
          --hyperparameter-path ../sglang/debug/request_duolun.yaml \
          --num-prompts 24 \
          --drop-ratio 0 \
          --pd-metrics \
          --max-concurrency 24 \
          --multi-turn

