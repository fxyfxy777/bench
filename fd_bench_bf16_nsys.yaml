global:
  port: 2788
  CUDA_VISIBLE_DEVICES: 0,1,2,3
  extra_ports_offsets: [100, 200, 300]  # metrics(+100), engine-worker-queue(+200), cache-queue(+300)
  health_url: "http://127.0.0.1:2788/health"
  server_ready_timeout: 1000   # 等待服务启动最长秒数
  shutdown_wait: 20           # kill server 后等待 GPU 显存释放的秒数
  results_dir: "./results"    # 结果目录（相对于本文件所在目录）

# ── 数据集路径 ────────────────────────────────────────────────────────────────
# 中短数据集：输入~2k 输出~1k
# ../sglang/debug/0724_ShareGPT_range_1800_3000_num_5000_FD.jsonl  (n=5000)
# 多轮数据集：输入~8k 输出~200
# ../sglang/debug/20260302_browsecomp_plus_processed_num_830_fd.jsonl  (n=830)
# 长输入数据集：输入~36k 输出~50
# ../sglang/debug/260226_loogle_longdep_NarrativeQA_mix_prefix_input_avg_35k_num_6748_with_only_max_tokens_for_fastdeploy.jsonl  (n=6748)
# 长输出数据集：输入~680 输出~18k
# ../sglang/debug/eb5_ppo_data_v1126_reasoning_merge_data_v1_for_release_gbs384_text_shuffled_250_with_output_tokens.jsonl  (n=250)

experiments:
  - name: fd_default
    nsys_session: fd_default
    nsys_output: debug/fd_profile_default_attn
    server: |
      export CUDA_VISIBLE_DEVICES=0,1,2,3
      export DG_CACHE_DIR=/root/paddlejob/share-storage/gpfs/system-public/fanxiangyu/.deep_gemm_cache
      export PYTHONPATH="../FastDeploy:$PYTHONPATH"
      export FD_SAMPLING_CLASS=rejection
      export FD_ENGINE_TASK_QUEUE_WITH_SHM=1
      export MAX_PREFILL_NUM=128
      model_path=/root/paddlejob/share-storage/gpfs/system-public/wangyanpeng04/models/GLM-4.5-Air-Multi-MTP
      ../nsys-2025.5.1/bin/nsys launch \
          --cuda-graph-trace=node \
          --session=fd_default \
          ../fxy_py12_fa4/bin/python -m fastdeploy.entrypoints.openai.api_server \
              --model $model_path \
              --port 2788 \
              --max-model-len 131072 \
              --enable-overlap-schedule \
              --tensor-parallel-size 4 \
              --max-num-seqs 512 \
              --enable-flashinfer-allreduce-fusion \
              --workers 1
    infer: |
      ../fxy_sglang/bin/python ../FastDeploy/benchmarks/benchmark_serving.py \
          --backend openai-chat \
          --model GLM-4.5-Air \
          --endpoint /v1/chat/completions \
          --host 127.0.0.1 --port 2788 \
          --dataset-name EBChat \
          --dataset-path ../sglang/debug/0724_ShareGPT_range_1800_3000_num_5000_FD.jsonl \
          --hyperparameter-path ../sglang/debug/request.yaml \
          --percentile-metrics ttft,tpot,itl,e2el,s_ttft,s_itl,s_e2el,s_decode,input_len,s_input_len,output_len \
          --metric-percentiles 80,95,99,99.9,99.95,99.99 \
          --num-prompts 1 \
          --max-concurrency 64

