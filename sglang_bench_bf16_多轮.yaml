global:
  port: 3016
  CUDA_VISIBLE_DEVICES: 0,1,2,3
  health_url: "http://127.0.0.1:3016/health"
  server_ready_timeout: 600   # 等待服务启动最长秒数（长输入模型加载慢，设长一点）
  shutdown_wait: 20           # kill server 后等待 GPU 显存释放的秒数
  results_dir: "./results"    # 结果目录（相对于本文件所在目录）


# ── 数据集路径 ────────────────────────────────────────────────────────────────
# 中短数据集：输入~2k 输出~1k
# ../sglang/debug/0724_ShareGPT_range_1800_3000_num_5000_FD.jsonl  (n=5000)
# 多轮数据集：输入~8k 输出~200
# ../sglang/debug/20260302_browsecomp_plus_processed_num_830_fd.jsonl  (n=830)
# 长输入数据集：输入~36k 输出~50
# ../sglang/debug/260226_loogle_longdep_NarrativeQA_mix_prefix_input_avg_35k_num_6748_with_only_max_tokens_for_fastdeploy.jsonl  (n=6748)
# 长输出数据集：输入~680 输出~18k
# ../sglang/debug/eb5_ppo_data_v1126_reasoning_merge_data_v1_for_release_gbs384_text_shuffled_250_with_output_tokens.jsonl  (n=250)

experiments:

  - name: sglang_静态多轮_MTP_c24_100条数据
    server: |
      export CUDA_VISIBLE_DEVICES=0,1,2,3
      export PYTHONPATH=../sglang/python:$PYTHONPATH
      export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libstdc++.so.6
      ../fxy_sglang/bin/python -m sglang.launch_server \
          --model-path /root/paddlejob/share-storage/gpfs/system-public/wangyanpeng04/models/GLM-4.5-Air-Multi-MTP \
          --host 0.0.0.0 --port 3016 \
          --tensor-parallel-size 4 \
          --max-running-requests 512 \
          --speculative-algorithm EAGLE \
          --speculative-num-steps 1 \
          --speculative-eagle-topk 1 \
          --speculative-num-draft-tokens 1 \
          --context-length 131072 \
          --allow-auto-truncate
    infer: |
      ../fxy_sglang/bin/python ../FastDeploy_RL/benchmarks/benchmark_serving.py \
          --backend openai-chat \
          --model GLM-4.5-Air \
          --endpoint /v1/chat/completions \
          --ip-list 127.0.0.1:3016 \
          --dataset-name EBChat \
          --dataset-path ../sglang/debug/swe_data_500_fd.json \
          --percentile-metrics ttft,tpot,itl,e2el,s_ttft,res_ttft,s_itl,s_e2el,s_decode,input_len,s_input_len,reasoning_len,output_len \
          --metric-percentiles 80,95,99,99.9,99.95,99.99 \
          --hyperparameter-path ../sglang/debug/request_duolun.yaml \
          --num-prompts 100 \
          --drop-ratio 0 \
          --pd-metrics \
          --max-concurrency 24 \
          --multi-turn
