global:
  port: 3015
  CUDA_VISIBLE_DEVICES: 0,1,2,3
  health_url: "http://127.0.0.1:3015/health"
  server_ready_timeout: 600   # 等待服务启动最长秒数（长输入模型加载慢，设长一点）
  shutdown_wait: 20           # kill server 后等待 GPU 显存释放的秒数
  results_dir: "./results"    # 结果目录（相对于本文件所在目录）

experiments:

  # ════════════════════════════════════════════════════════════════════════════
  # 一、中短数据集  输入:2k  输出:1k
  # ════════════════════════════════════════════════════════════════════════════

  
  # ════════════════════════════════════════════════════════════════════════════
  # 二、多轮数据集  输入:8k  输出:200
  # ════════════════════════════════════════════════════════════════════════════

  - name: sglang_多轮_MTP_c512
    server: |
      export CUDA_VISIBLE_DEVICES=0,1,2,3
      export PYTHONPATH=../sglang/python:$PYTHONPATH
      export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libstdc++.so.6
      ../fxy_sglang/bin/python -m sglang.launch_server \
          --model-path ..//models/GLM-4.5-Air \
          --host 0.0.0.0 --port 3015 \
          --tensor-parallel-size 4 \
          --max-running-requests 512 \
          --speculative-algorithm EAGLE \
          --speculative-num-steps 1 \
          --speculative-eagle-topk 1 \
          --speculative-num-draft-tokens 1 \
          --context-length 131072
    infer: |
      ../fxy_sglang/bin/python \
          ../FastDeploy/benchmarks/benchmark_serving.py \
          --backend openai-chat \
          --model GLM-4.5-Air \
          --endpoint /v1/chat/completions \
          --host 127.0.0.1 --port 3015 \
          --dataset-name EBChat \
          --dataset-path ../sglang/debug/20260302_browsecomp_plus_processed_num_830_fd.jsonl \
          --hyperparameter-path ../sglang/debug/request_duolun.yaml \
          --percentile-metrics ttft,tpot,itl,e2el,s_ttft,s_itl,s_e2el,s_decode,input_len,s_input_len,output_len \
          --metric-percentiles 80,95,99,99.9,99.95,99.99 \
          --num-prompts 830 \
          --multi-turn \
          --max-concurrency 512

